name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t sanviag/test:${{ github.sha }} .

      - name: Scan image with Trivy
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --format table \
            sanviag/test:${{ github.sha }} | tee trivy-results.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-results.txt

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | \
            docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

          docker push sanviag/test:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 --decode > ~/.ssh/github_actions_deploy
          chmod 600 ~/.ssh/github_actions_deploy
          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts
      
      - name: Validate SSH key
        run: |
          ssh-keygen -y -f ~/.ssh/github_actions_deploy > /dev/null

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/github_actions_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy@${{ secrets.SERVER_IP }} \
            "docker pull sanviag/test:${{ github.sha }} && \
             docker stop myapp 2>/dev/null || true && \
             docker rm myapp 2>/dev/null || true && \
             docker run -d \
               --name myapp \
               --restart unless-stopped \
               --read-only \
               --cap-drop=ALL \
               --security-opt=no-new-privileges:true \
               -p 80:3000 \
               sanviag/test:${{ github.sha }}"